<section class="p-4 sm:p-8">
  <p-card styleClass="max-w-screen-sm m-auto">
    <div class="w-full py-6 px-2 sm:px-4">
      <div class="text-center mb-8">
        <img src="https://blocks.primeng.org/assets/images/blocks/logos/hyper.svg" alt="Logo" height="50" class="mb-4">
        <div class="text-3xl font-medium mb-4">¡Hola!</div>
        <span class="font-medium">¿No tienes una cuenta?</span>
        <a routerLink="../register" class="font-medium no-underline ml-2 text-blue-500 cursor-pointer">Crear una</a>
      </div>

      <form autocomplete="off">
        <div class="mb-4">
          <label for="email" class="block font-medium mb-2">Email</label>
          <input pInputText type="text" id="email" placeholder="Ingresa tu correo" class="w-full"/>
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>

        <div class="mb-4">
          <label for="password" class="block font-medium mb-2">Contraseña</label>
          <p-password id="password" placeholder="Ingresa contraseña" toggleMask feedback="false" styleClass="w-full" />
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>

        <div class="flex justify-between items-center mb-12">
          <div class="flex items-center">
            <p-checkbox id="rememberme" [binary]="true" styleClass="mr-2"></p-checkbox>
            <label for="rememberme">Recordarme</label>
          </div>
          <a class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer">¿Olvidaste la contraseña?</a>
        </div>

        <p-button label="Ingresar" styleClass="w-full" routerLink="/dashboard">
          <i class="pi pi-user absolute left-4"></i>
        </p-button>
      </form>
    </div>
  </p-card>
</section>
