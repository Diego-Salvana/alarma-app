<section class="p-4 sm:p-8">
  <p-card styleClass="max-w-screen-sm m-auto">
    <div class="w-full py-6 px-2 sm:px-4">
      <div class="text-center mb-8">
        <img src="https://blocks.primeng.org/assets/images/blocks/logos/hyper.svg" alt="Logo" height="50" class="mb-4">
        <div class="text-3xl font-medium mb-4">Crea una cuenta</div>
        <span class="font-medium">¿Ya tienes una?</span>
        <a routerLink="../login" class="font-medium no-underline ml-2 text-blue-500 cursor-pointer">Iniciar Sesión</a>
      </div>

      <form autocomplete="off">
        <div class="mb-4">
          <label for="name" class="block font-medium mb-2">Nombre</label>
          <input pInputText type="text" id="name" placeholder="Ingresa tu nombre" class="w-full">
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>

        <div class="mb-4">
          <label for="lastname" class="block font-medium mb-2">Apellido</label>
          <input pInputText type="text" id="lastname" placeholder="Ingresa tu apellido" class="w-full">
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>

        <div class="mb-4">
          <label for="email" class="block font-medium mb-2">Email</label>
          <input pInputText type="text" id="email" placeholder="Ingresa tu correo" class="w-full">
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>

        <div class="mb-4">
          <label for="phone" class="block font-medium mb-2">Teléfono</label>
          <p-inputmask id="phone" mask="9999-999999999" placeholder="0011-155999999" styleClass="w-full"/>
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>

        <div class="mb-4">
          <label for="password" class="block font-medium mb-2">Contraseña</label>
          <p-password id="password" placeholder="Ingresa contraseña" toggleMask promptLabel="Escribe una contraseña"
            weakLabel="Débil" mediumLabel="Medio" strongLabel="Fuerte" styleClass="w-full" />
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>

        <div class="mb-12">
          <label for="re-password" class="block font-medium mb-2">Repite Contraseña</label>
          <p-password id="re-password" placeholder="Ingresa nuevamente la contraseña" toggleMask feedback="false"
            styleClass="w-full" />
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>

        <p-button label="Registrarse" styleClass="w-full">
          <i class="pi pi-user-plus absolute left-4"></i>
        </p-button>
      </form>
    </div>
  </p-card>
</section>
