@if (!successful()) {
  <h1 class="text-2xl font-bold text-center mt-8">Verificando email...</h1>
  <p class="text-center mt-4">Por favor, espere un momento...</p>
  <!-- Spinner -->
  <div class="flex justify-center mt-4">
    <div class="animate-spin rounded-full h-12 w-12"></div>
  </div>
} @else {
  <h1 class="text-2xl font-bold text-center mt-8">Email verificado correctamente</h1>
  <p class="text-center mt-4">Su email ha sido verificado con éxito</p>
}
