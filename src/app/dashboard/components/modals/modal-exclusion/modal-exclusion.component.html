<div class="card flex justify-center">
  <p-dialog header="Exclusión" modal maximizable draggable="false" [(visible)]="visible"
    styleClass="w-[95%] max-w-screen-sm">
    <span class="p-text-secondary block mb-8">Deshabilita los sensores que desees y luego activa la alarma.</span>

    <div class="mb-4">
      <p-table [value]="sensors">
        <ng-template #body let-sensor>
          <tr class="row">
            <td>
              <i class="pi pi-hashtag !text-xs mr-1"></i>
              <span>{{ sensor.nombre }}</span>
            </td>
            <td class="!text-right md:!text-right !font-semibold !text-muted-color-emphasis">
              <p-toggleswitch [ngModel]="sensor.estado" />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <div class="text-center mt-8">
      <p-button id="btn-activate" label="Activar alarma" severity="danger" raised outlined icon="pi pi-lock"
        styleClass="w-full sm:w-max sm:!px-16 red-text red-border" (click)="close()" />

      <!-- <p-button label="Activar alarma" icon="pi pi-lock" styleClass="w-full !px-8" (click)="close()" /> -->
    </div>
  </p-dialog>
</div>
