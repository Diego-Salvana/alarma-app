<div class="card flex justify-center">
  <p-dialog header="Modificar clave" [modal]="true" [(visible)]="visible" styleClass="w-[95%] max-w-screen-sm">
    <span class="p-text-secondary block mb-8">Establece una nueva contraseña.</span>

    <div class="flex items-center gap-4 mb-4">
      <label for="current-pass" class="font-semibold w-24">Contraseña actual</label>
      <div class="grow">
        <p-password id="current-pass" toggleMask feedback="false" />
        <!-- <small>No coinciden las contraseñas</small> -->
      </div>
    </div>
    <div class="flex items-center gap-4 mb-4">
      <label for="new-pass" class="font-semibold w-24">Nueva contraseña</label>
      <div class="grow">
        <p-password id="new-pass" toggleMask promptLabel="Escribe una contraseña" weakLabel="Débil" mediumLabel="Medio"
          strongLabel="Fuerte" />
        <!-- <small>No coinciden las contraseñas</small> -->
      </div>
    </div>
    <div class="flex items-center gap-4 mb-4">
      <label for="re-new-pass" class="font-semibold w-24">Repite contraseña</label>
      <div class="grow">
        <p-password id="current-pass" toggleMask feedback="false" />
        <!-- <small>No coinciden las contraseñas</small> -->
      </div>
    </div>

    <ng-template #footer>
      <p-button label="Cancelar" severity="secondary" (click)="close()" />
      <p-button label="Guardar" (click)="close()" />
    </ng-template>
  </p-dialog>
</div>
