<p-card>
  <p-table [value]="sensors" selectionMode="single">
    <ng-template #body let-sensor>
      <tr [pSelectableRow]="sensor" class="row" routerLink="./sensor/1">
        <td>
          <i class="pi pi-hashtag !text-xs mr-1"></i>
          <span>{{ sensor.nombre }}</span>
        </td>
        <td class="!text-right md:!text-left !font-semibold !text-muted-color-emphasis">
          <i>{{ sensor.estado }}</i>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
