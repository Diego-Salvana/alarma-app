<h4 class="text-muted-color tracking-wide mb-8">Historial de disparos de Alarma</h4>
<div>
  <p-timeline [value]="events">
    <ng-template #opposite let-event>
      <small class="text-surface-500 dark:text-surface-400 block md:inline">{{ event.date }}</small>
      <small class="text-surface-500 dark:text-surface-400 ml-2">{{ event.hour }}</small>
    </ng-template>

    <ng-template #content let-event>
      <span>{{ event.status }}</span>
    </ng-template>
  </p-timeline>
</div>
